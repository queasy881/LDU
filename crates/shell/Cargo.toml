[package]
name = "disasmstudio"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
description = "DisasmStudio — native disassembler shell (wry/tao host)"

[[bin]]
name = "disasmstudio"
path = "src/main.rs"

[dependencies]
wry = "0.55.1"
tao = "0.35.3"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

bridge = { path = "../bridge" }
binparser = { path = "../binary-parser" }
