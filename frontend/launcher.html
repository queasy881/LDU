<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DisasmStudio</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/launcher.css" />
</head>
<body>
  <main class="launcher">
    <header class="lc-head">
      <div class="lc-title">DisasmStudio</div>
      <div class="lc-sub">Static binary decompiler</div>
    </header>

    <div class="lc-actions">
      <button id="lc-new" class="btn btn-primary">New project</button>
      <button id="lc-open" class="btn">Open project…</button>
    </div>

    <form id="lc-newform" class="lc-form" hidden>
      <input id="lc-name" class="field" placeholder="Project name" maxlength="80" spellcheck="false" autocomplete="off" />
      <button id="lc-create" type="submit" class="btn btn-primary btn-sm">Create</button>
      <button id="lc-cancel" type="button" class="btn btn-ghost btn-sm">Cancel</button>
    </form>
    <div id="lc-error" class="lc-error" hidden></div>

    <section class="lc-recent">
      <div class="lc-recent-head">
        <span class="lc-recent-label">Recent</span>
        <span id="side-count" class="lc-recent-count"></span>
        <button id="lc-refresh" class="btn-ghost btn-sm lc-reload">Refresh</button>
      </div>
      <div id="lc-list" class="lc-list"></div>
      <div id="lc-empty" class="empty" hidden>No projects yet.</div>
    </section>
  </main>

  <script defer src="js/ipc.js"></script>
  <script defer src="js/util.js"></script>
  <script defer src="js/core.js"></script>
  <script defer src="js/launcher.js"></script>
</body>
</html>
