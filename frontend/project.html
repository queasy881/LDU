<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DisasmStudio — Project</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/project.css" />
</head>
<body>
  <div id="project">
    <header class="pj-bar">
      <div class="pj-head">
        <div class="eyebrow">Project</div>
        <h1 id="pj-name" class="pj-name">&mdash;</h1>
      </div>
      <button id="pj-add" class="btn btn-primary">+&nbsp; Analyze New Binary</button>
    </header>

    <div id="pj-error" class="pj-error" hidden></div>

    <main class="pj-body">
      <div class="pj-list-head">
        <span class="eyebrow">Binaries</span>
        <span id="bin-count" class="pane-count"></span>
      </div>
      <div id="bin-list" class="bin-list"></div>
      <div id="bin-empty" class="empty-state" hidden>
        No binaries yet.<br />Add an <b>EXE</b>, <b>DLL</b>, or <b>SYS</b> to disassemble.
      </div>
    </main>
  </div>

  <script defer src="js/ipc.js"></script>
  <script defer src="js/util.js"></script>
  <script defer src="js/core.js"></script>
  <script defer src="js/project.js"></script>
</body>
</html>
