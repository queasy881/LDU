<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DisasmStudio — Project</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/project.css" />
</head>
<body>
  <div class="project">
    <header class="pj-head">
      <div class="pj-title-wrap">
        <div class="pj-eyebrow">Project</div>
        <h1 id="pj-name" class="pj-name">—</h1>
      </div>
      <button id="pj-add" class="btn btn-primary">Add binary…</button>
    </header>

    <div id="pj-error" class="pj-error" hidden></div>

    <main class="pj-body">
      <div class="pj-list-head">
        <span class="pj-list-label">Binaries</span>
        <span id="bin-count" class="muted"></span>
      </div>
      <div id="bin-list" class="bin-list"></div>
      <div id="bin-empty" class="empty" hidden>No binaries yet. Add an EXE, DLL, or SYS to disassemble.</div>
    </main>
  </div>

  <script defer src="js/ipc.js"></script>
  <script defer src="js/util.js"></script>
  <script defer src="js/core.js"></script>
  <script defer src="js/project.js"></script>
</body>
</html>
