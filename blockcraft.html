const FUV=[[0,0],[1,0],[1,1],[0,1]], EPS=0.02;
function tileUV(t,u,v){
  const col=t%4, row=(t/4)|0;
  return [(col+EPS+u*(1-2*EPS))/4, ((3-row)+EPS+v*(1-2*EPS))/4];
}
function faceVisible(b,nb){
  const B=BLOCKS[b];
  if(B.liquid) return nb===0;                       // water only against air
  if(B.glassy) return nb===0||(nb&&BLOCKS[nb].liquid); // glass vs air/water
  return !isOpaque(nb);                             // opaque vs anything see-through
}
const chunks=new Array(NCX*NCZ).fill(null);

  const geo={solid:{p:[],u:[],c:[],i:[]}, trans:{p:[],u:[],c:[],i:[]}};
  for(let x=cx*CS;x<(cx+1)*CS;x++) for(let z=cz*CS;z<(cz+1)*CS;z++) for(let y=0;y<WY;y++){
    const b=getB(x,z,y); if(!b) continue;
    const B=BLOCKS[b], g=(B.liquid||B.glassy)?geo.trans:geo.solid;
    for(let f=0;f<6;f++){
      const F=FACES[f];
      if(!faceVisible(b,getB(x+F.n[0],z+F.n[2],y+F.n[1]))) continue;
      const base=g.p.length/3, tile=B.f[f];
      let sh=F.sh;
      // lower water surface a touch so it reads as liquid
      const drop=(B.liquid&&getB(x,z,y+1)!==9)?0.12:0;
      for(let v=0;v<4;v++){
        const C=F.c[v];
        g.p.push(x+C[0], y+C[1]-(C[1]===1?drop:0), z+C[2]);
        const uv=tileUV(tile,FUV[v][0],FUV[v][1]);
        g.u.push(uv[0],uv[1]);
        g.c.push(sh,sh,sh);
      }
      g.i.push(base,base+1,base+2, base,base+2,base+3);
    }
  }
  const meshes=[];
  for(const key of ["solid","trans"]){
    const G=geo[key]; if(!G.i.length) continue;
    const bg=new THREE.BufferGeometry();
    bg.setAttribute("position",new THREE.Float32BufferAttribute(G.p,3));
    bg.setAttribute("uv",new THREE.Float32BufferAttribute(G.u,2));
    bg.setAttribute("color",new THREE.Float32BufferAttribute(G.c,3));
    bg.setIndex(G.i);
    const m=new THREE.Mesh(bg, key==="solid"?matSolid:matTrans);
    m.renderOrder=key==="solid"?0:1;
    m.frustumCulled=true; scene.add(m); meshes.push(m);
  }
  chunks[cx*NCZ+cz]=meshes;
}
function rebuildAt(x,z){
  const cx=(x/CS)|0, cz=(z/CS)|0; buildChunk(cx,cz);
  if(x%CS===0&&cx>0)buildChunk(cx-1,cz);   if(x%CS===CS-1&&cx<NCX-1)buildChunk(cx+1,cz);
  if(z%CS===0&&cz>0)buildChunk(cx,cz-1);   if(z%CS===CS-1&&cz<NCZ-1)buildChunk(cx,cz+1);
}
for(let cx=0;cx<NCX;cx++) for(let cz=0;cz<NCZ;cz++) buildChunk(cx,cz);

/* ============ player + physics ============ */
const P={pos:new THREE.Vector3(), vel:new THREE.Vector3(), yaw:Math.PI*0.25, pitch:-0.1,
         hw:0.3, h:1.8, eye:1.62, onGround:false, fly:false};
(function spawn(){
  const x=WX>>1, z=WZ>>1;
  for(let y=WY-1;y>0;y--) if(isSolid(getB(x,z,y))){P.pos.set(x+0.5,y+1.01,z+0.5);return;}
})();
function boxHits(px,py,pz){
  const x0=Math.floor(px-P.hw), x1=Math.floor(px+P.hw);
  const z0=Math.floor(pz-P.hw), z1=Math.floor(pz+P.hw);
  const y0=Math.floor(py),      y1=Math.floor(py+P.h-0.001);
  for(let x=x0;x<=x1;x++)for(let z=z0;z<=z1;z++)for(let y=y0;y<=y1;y++)
    if(isSolid(getB(x,z,y))) return true;
  return false;
}
function moveAxis(d,axis){ // incremental sweep, returns true if blocked
  let rem=d, blocked=false;
  while(Math.abs(rem)>1e-6){
    const step=Math.sign(rem)*Math.min(Math.abs(rem),0.05);
    const t=P.pos.clone(); t[axis]+=step;
    if(boxHits(t.x,t.y,t.z)){blocked=true;break;}
    P.pos[axis]+=step; rem-=step;
  }
  return blocked;
}
const keys={};
addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(e.code==="KeyF"&&locked){P.fly=!P.fly;P.vel.set(0,0,0);flash(P.fly?"Fly: ON":"Fly: OFF");}
  if(/^Digit[1-9]$/.test(e.code)) selectSlot(+e.code[5]-1);
});
addEventListener("keyup",e=>keys[e.code]=false);

function inWater(){ // feet or body in water
  return getB(Math.floor(P.pos.x),Math.floor(P.pos.z),Math.floor(P.pos.y+0.4))===9;
}
function eyeInWater(){
  return getB(Math.floor(P.pos.x),Math.floor(P.pos.z),Math.floor(P.pos.y+P.eye))===9;
}
function physics(dt){
  const wet=inWater();
  const f=new THREE.Vector3(Math.sin(P.yaw),0,Math.cos(P.yaw));
  const r=new THREE.Vector3(f.z,0,-f.x);
  let wish=new THREE.Vector3();
  if(keys.KeyW)wish.add(f); if(keys.KeyS)wish.sub(f);
  if(keys.KeyD)wish.add(r); if(keys.KeyA)wish.sub(r);
  if(wish.lengthSq())wish.normalize();
  let speed=(keys.ShiftLeft||keys.ShiftRight)&&!P.fly?6.2:4.4;
  if(wet)speed*=0.55; if(P.fly)speed=11;
  P.vel.x=wish.x*speed; P.vel.z=wish.z*speed;

  if(P.fly){
    P.vel.y=(keys.Space?9:0)+((keys.ShiftLeft||keys.ShiftRight)?-9:0);
  }else if(wet){
    P.vel.y-=14*dt; P.vel.y*=0.92;
    if(keys.Space)P.vel.y=4.2;
  }else{
    P.vel.y-=26*dt;
    if(keys.Space&&P.onGround)P.vel.y=8.6;
  }
  P.vel.y=Math.max(P.vel.y,-40);

  moveAxis(P.vel.x*dt,"x");
  moveAxis(P.vel.z*dt,"z");
  const blockedY=moveAxis(P.vel.y*dt,"y");
  P.onGround=blockedY&&P.vel.y<0;
  if(blockedY)P.vel.y=0;
  if(P.pos.y<-12){P.pos.set(WX/2+0.5,WY,WZ/2+0.5);P.vel.set(0,0,0);}
}

/* ============ look / pointer lock ============ */
let locked=false;
const overlay=document.getElementById("overlay");
overlay.addEventListener("click",()=>renderer.domElement.requestPointerLock());
document.addEventListener("pointerlockchange",()=>{
  locked=document.pointerLockElement===renderer.domElement;
  overlay.classList.toggle("hide",locked);
});
addEventListener("mousemove",e=>{
  if(!locked)return;
  P.yaw-=e.movementX*0.0023;
  P.pitch-=e.movementY*0.0023;
  P.pitch=Math.max(-1.55,Math.min(1.55,P.pitch));
});
addEventListener("contextmenu",e=>e.preventDefault());

/* ============ raycast (DDA) ============ */
function raycast(maxD){
  const o=new THREE.Vector3(P.pos.x,P.pos.y+P.eye,P.pos.z);
  const d=new THREE.Vector3(Math.sin(P.yaw)*Math.cos(P.pitch),Math.sin(P.pitch),
                            Math.cos(P.yaw)*Math.cos(P.pitch));
  let x=Math.floor(o.x),y=Math.floor(o.y),z=Math.floor(o.z);
  const sx=Math.sign(d.x),sy=Math.sign(d.y),sz=Math.sign(d.z);
  const dx=Math.abs(1/(d.x||1e-9)),dy=Math.abs(1/(d.y||1e-9)),dz=Math.abs(1/(d.z||1e-9));
  let tx=(sx>0?x+1-o.x:o.x-x)*dx, ty=(sy>0?y+1-o.y:o.y-y)*dy, tz=(sz>0?z+1-o.z:o.z-z)*dz;
  let face=[0,0,0], t=0;
  while(t<=maxD){
    const b=getB(x,z,y);
    if(b&&b!==9) return {x,y,z,b,face};
    if(tx<ty&&tx<tz){x+=sx;t=tx;tx+=dx;face=[-sx,0,0];}
    else if(ty<tz){y+=sy;t=ty;ty+=dy;face=[0,-sy,0];}
    else{z+=sz;t=tz;tz+=dz;face=[0,0,-sz];}
  }
  return null;
}
const hl=new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(1.002,1.002,1.002)),
  new THREE.LineBasicMaterial({color:0x111111}));
hl.visible=false; scene.add(hl);

addEventListener("mousedown",e=>{
  if(!locked)return;
  const hit=raycast(6); if(!hit)return;
  if(e.button===0){ // break
    if(BLOCKS[hit.b].unbreakable){flash("Bedrock is unbreakable");return;}
    setB(hit.x,hit.z,hit.y,0); rebuildAt(hit.x,hit.z);
  }else if(e.button===2){ // place
    const px=hit.x+hit.face[0], py=hit.y+hit.face[1], pz=hit.z+hit.face[2];
    const cur=getB(px,pz,py);
    if(!inW(px,pz,py)||(cur!==0&&cur!==9))return;
    // don't place inside the player
    const ox=P.pos.x,oy=P.pos.y,oz=P.pos.z;
    if(px+1>ox-P.hw&&px<ox+P.hw&&pz+1>oz-P.hw&&pz<oz+P.hw&&py+1>oy&&py<oy+P.h)return;
    setB(px,pz,py,HOTBAR[sel]); rebuildAt(px,pz);
  }
});

/* ============ hotbar ============ */
const HOTBAR=[1,2,3,4,5,8,6,7,10];
const HTILE ={1:0,2:2,3:3,4:4,5:5,8:9,6:6,7:8,10:12};
let sel=0;
const hb=document.getElementById("hotbar"), bname=document.getElementById("bname");
HOTBAR.forEach((b,i)=>{
  const s=document.createElement("div");s.className="slot";
  const t=HTILE[b],col=t%4,row=(t/4)|0;
  s.innerHTML=`<span class="key">${i+1}</span><div class="tex" style="background-position:${col*100/3}% ${row*100/3}%"></div>`;
  hb.appendChild(s);
});
let flashT=null;
function flash(txt){bname.textContent=txt;bname.style.opacity=1;
  clearTimeout(flashT);flashT=setTimeout(()=>bname.style.opacity=0,1200);}
function selectSlot(i){
  if(i<0||i>=HOTBAR.length)return; sel=i;
  hb.querySelectorAll(".slot").forEach((s,j)=>s.classList.toggle("sel",j===sel));
  flash(BLOCKS[HOTBAR[sel]].name);
}
selectSlot(0); bname.style.opacity=0;
addEventListener("wheel",e=>{ if(locked) selectSlot((sel+(e.deltaY>0?1:-1)+HOTBAR.length)%HOTBAR.length); });

/* ============ main loop ============ */
const info=document.getElementById("info"), wet=document.getElementById("wet");
let last=performance.now(), frames=0, fps=0, fpsT=last;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-last)/1000,0.05); last=now;
  if(locked)physics(dt);
  camera.position.set(P.pos.x,P.pos.y+P.eye,P.pos.z);
  camera.rotation.set(0,0,0);
  camera.rotateY(P.yaw); camera.rotateX(P.pitch);

  const hit=locked?raycast(6):null;
  hl.visible=!!hit;
  if(hit)hl.position.set(hit.x+0.5,hit.y+0.5,hit.z+0.5);

  for(const c of clouds){c.position.x+=c.userData.v*dt; if(c.position.x>WX*1.4)c.position.x=-WX*0.4;}

  const under=eyeInWater();
  wet.style.opacity=under?0.35:0;
  scene.fog.near=under?4:52; scene.fog.far=under?26:110;
  renderer.setClearColor(under?0x2a5fae:SKY);
  scene.fog.color.set(under?0x2a5fae:SKY);

  frames++;
  if(now-fpsT>500){fps=Math.round(frames*1000/(now-fpsT));frames=0;fpsT=now;}
  info.textContent=`XYZ ${P.pos.x.toFixed(1)} / ${P.pos.y.toFixed(1)} / ${P.pos.z.toFixed(1)}   FPS ${fps}${P.fly?"   [FLY]":""}`;
  renderer.render(scene,camera);
}
requestAnimationFrame(loop);
</script>
