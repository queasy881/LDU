[workspace]
resolver = "2"
members = [
    "crates/shell",
    "crates/binary-parser",
    "crates/bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["DisasmStudio"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
